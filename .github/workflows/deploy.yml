name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH + pull + rebuild on droplet
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          USER: ${{ secrets.DROPLET_USER }}
        run: |
          ssh -i ~/.ssh/deploy "$USER@$HOST" bash -se <<'EOF'
            set -euo pipefail
            cd /opt/mrs-samuel
            echo "==> Pull"
            git fetch --quiet origin master
            git reset --hard origin/master
            echo "==> Build + up (migrator runs automatically)"
            docker compose up -d --build --remove-orphans
            echo "==> Pruning dangling images"
            docker image prune -f >/dev/null
            # Build files pile up with every deploy (they reached ~50 GB and
            # 78% of the disk in Nov 2026). Keep the last 3 days so the next
            # build stays fast; drop the rest. Never fail the deploy on this.
            echo "==> Pruning build files older than 3 days"
            docker builder prune -f --filter "until=72h" >/dev/null 2>&1 || echo "builder prune skipped"
            USED=$(df --output=pcent / | tail -1 | tr -dc '0-9')
            echo "Disk: ${USED}% used"
            if [ "${USED:-0}" -ge 85 ]; then
              echo "::warning::Server disk is ${USED}% full. A full disk stops the database."
            fi
            echo "==> Health"
            sleep 8
            for i in 1 2 3 4 5 6; do
              if curl -sf http://localhost:3001/v1/health >/dev/null; then
                echo "API healthy"
                exit 0
              fi
              sleep 5
            done
            echo "API not healthy after 30s — recent logs:"
            docker compose logs --tail=80 api
            exit 1
          EOF
